services:
  blog:
    build: .
    image: deek-blog:1.3.0
    container_name: blog
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      PORT: "8080"
      # 对外访问地址，用于拼接找回密码链接，部署后改成你的域名
      SITE_URL: "http://localhost:8080"
      # 务必替换为 32 位以上的随机字符串
      JWT_SECRET: "please-change-this-to-a-random-string-at-least-32-chars"
      # SMTP 找回密码：改完重启容器
      MAIL_ENABLED: "false"
      MAIL_HOST: "smtp.qq.com"
      MAIL_PORT: "465"
      MAIL_SSL: "true"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      APP_VERSION: "1.3.0"
    volumes:
      # H2 数据库与上传图片持久化到宿主机
      - ./data:/app/data
      - ./uploads:/app/uploads
      # 首次初始化向导写入的配置（含数据库/Redis 口令），必须持久化
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/meta/site >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
